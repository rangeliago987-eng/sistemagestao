<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stylo Fibra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.9/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#E8E2CE;
    --surface:#FFFDF7;
    --surface-2:#F4EFDE;
    --ink:#1E2B27;
    --muted:#5C6B63;
    --border:#D9CFB1;
    --accent:#0E6E68;
    --accent-ink:#F4FBFA;
    --accent-2:#B65425;
    --st-quente:#E4572E;
    --st-morno:#D9A404;
    --st-frio:#3C6E96;
    --st-fechado:#2E8B57;
    --st-posvenda:#7C5CB0;
    --shadow: 0 1px 2px rgba(30,43,39,.06), 0 6px 20px -8px rgba(30,43,39,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101E1A;
      --surface:#172723;
      --surface-2:#1E322C;
      --ink:#EDEAE0;
      --muted:#9CAAA1;
      --border:#2C4038;
      --accent:#4FBDB2;
      --accent-ink:#0B1A17;
      --accent-2:#E08A52;
      --st-quente:#FF7A54;
      --st-morno:#F0B429;
      --st-frio:#6FA4CE;
      --st-fechado:#57C08A;
      --st-posvenda:#A98AD9;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101E1A;
    --surface:#172723;
    --surface-2:#1E322C;
    --ink:#EDEAE0;
    --muted:#9CAAA1;
    --border:#2C4038;
    --accent:#4FBDB2;
    --accent-ink:#0B1A17;
    --accent-2:#E08A52;
    --st-quente:#FF7A54;
    --st-morno:#F0B429;
    --st-frio:#6FA4CE;
    --st-fechado:#57C08A;
    --st-posvenda:#A98AD9;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    margin:0;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand-name,.stat-num{font-family:"Sora", ui-sans-serif, system-ui, sans-serif;}
  .num, input[type="number"], .money{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}

  .app{display:flex; min-height:100vh;}

  /* ---------- sidebar ---------- */
  .sidebar{
    width:236px; flex:none; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:20px 16px; gap:20px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-size:18px; flex:none;
  }
  .brand-name{font-weight:700; font-size:16.5px; line-height:1.1;}
  .brand-sub{font-size:11px; color:var(--muted); margin-top:1px;}

  nav.tabs{display:flex; flex-direction:column; gap:2px;}
  .tab-btn{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; border:none;
    background:transparent; color:var(--muted); font-size:14px; font-weight:500; cursor:pointer; text-align:left;
  }
  .tab-btn:hover{background:var(--surface-2); color:var(--ink);}
  .tab-btn.active{background:var(--accent); color:var(--accent-ink);}
  .tab-btn .ico{width:18px; text-align:center;}

  .side-summary{
    margin-top:auto; background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:14px; display:flex; flex-direction:column; gap:10px;
  }
  .side-summary h4{margin:0; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600;}
  .side-stat{display:flex; justify-content:space-between; align-items:baseline; font-size:13px;}
  .side-stat .v{font-weight:600;}
  .mode-badge{font-size:10.5px; color:var(--muted); display:flex; align-items:center; gap:5px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
  .dot.local{background:var(--accent-2);}

  /* ---------- main ---------- */
  main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    padding:22px 28px 6px; display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .topbar h1{font-size:21px; margin:0; text-wrap:balance;}
  .topbar .date{font-size:12.5px; color:var(--muted);}
  .conn-status{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--surface-2); white-space:nowrap;}
  #view{padding:16px 28px 40px; flex:1;}

  .btn{
    border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:8px;
    padding:8px 14px; font-size:13.5px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
  }
  .btn:hover{background:var(--surface-2);}
  .btn-primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-ghost{border-color:transparent; background:transparent;}
  .btn-sm{padding:5px 10px; font-size:12.5px; border-radius:7px;}
  .btn-danger{color:var(--st-quente); border-color:var(--st-quente);}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow);}

  /* ---------- login ---------- */
  .app.app-hidden{display:none;}
  .login-gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--bg);
  }
  .login-card{
    width:100%; max-width:340px; padding:26px 24px; display:flex; flex-direction:column; gap:16px;
  }
  .login-card .brand{justify-content:center;}
  .login-card p{margin:0; font-size:13px; color:var(--muted); text-align:center;}
  .login-card .field input{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink);
    border-radius:8px; padding:9px 11px; font-size:14px;
  }
  .login-card .field input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .login-card .btn-primary{justify-content:center; padding:10px 14px;}
  #loginError{font-size:12.5px; color:var(--st-quente); min-height:1.2em; text-align:center;}

  /* ---------- pipeline ---------- */
  .pipeline-head{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
  .board{display:grid; grid-template-columns:repeat(5, minmax(210px,1fr)); gap:12px; overflow-x:auto;}
  @media (max-width:1100px){ .board{grid-template-columns:repeat(5, minmax(240px,1fr)); } }
  .col{background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px; min-height:120px; display:flex; flex-direction:column; gap:8px;}
  .col-head{display:flex; align-items:center; gap:8px; padding:2px 4px 4px;}
  .stage-dot{width:9px;height:9px;border-radius:50%; flex:none;}
  .col-head .label{font-weight:600; font-size:13px;}
  .col-head .count{margin-left:auto; font-size:12px; color:var(--muted);}
  .lead-card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 11px; cursor:pointer; display:flex; flex-direction:column; gap:4px;}
  .lead-card:hover{border-color:var(--accent);}
  .lead-card .nome{font-weight:600; font-size:13.5px;}
  .lead-card .produto{font-size:12px; color:var(--muted);}
  .lead-card .valor{font-size:13px; font-weight:600; margin-top:2px;}
  .empty-col{font-size:12px; color:var(--muted); padding:8px 4px; font-style:italic;}

  .leadchart{display:flex; align-items:flex-end; gap:4px; height:70px;}
  .leadchart .bar{flex:1; background:var(--accent); border-radius:3px 3px 0 0; min-height:2px; position:relative;}
  .leadchart .bar .tip{position:absolute; top:-16px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--muted); white-space:nowrap;}
  .leadchart-labels{display:flex; justify-content:space-between; margin-top:4px; font-size:10px; color:var(--muted);}

  .timeline{display:flex; flex-direction:column;}
  .tl-item{display:grid; grid-template-columns:32px 1fr; gap:16px; position:relative; padding-bottom:26px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-num{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px; z-index:1; flex:none;}
  .tl-item:not(:last-child)::before{content:"";position:absolute; left:15px; top:32px; bottom:0; width:2px; background:var(--border);}
  .tl-body h4{margin:0 0 4px; font-size:14.5px; font-weight:600; display:flex; align-items:center; flex-wrap:wrap; gap:8px;}
  .tl-body p.obj{margin:0 0 8px; font-size:12.5px; color:var(--muted); line-height:1.5;}
  .tl-checklist{list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:6px;}
  .tl-checklist li{font-size:12.5px; padding:8px 10px; background:var(--surface-2); border-radius:8px; border:1px solid var(--border); line-height:1.45;}
  .tl-badge{display:inline-block; font-size:10px; padding:2px 8px; border-radius:99px; background:var(--surface-2); color:var(--muted); font-weight:500;}

  .client-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px;}
  .client-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:6px;}
  .client-card .nome{font-weight:600; font-size:14px;}
  .client-card .meta{font-size:12px; color:var(--muted);}
  .client-card .val{font-size:13px; font-weight:600; margin-top:2px;}

  .gallery-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px;}
  .gallery-item{background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; display:flex; flex-direction:column;}
  .gallery-item .thumb{width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--surface-2); display:block;}
  .gallery-item .thumb-empty{width:100%; aspect-ratio:1/1; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px;}
  .gallery-item .meta{padding:8px 10px; display:flex; flex-direction:column; gap:4px;}
  .gallery-item .meta .t{font-size:12.5px; font-weight:600;}
  .gallery-item .meta .g{font-size:11px; color:var(--muted);}

  .prompt-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
  .prompt-card h4{margin:0; font-size:14px;}
  .prompt-card pre{white-space:pre-wrap; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; margin:0; color:var(--muted); line-height:1.5;}

  /* ---------- generic lists / tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border);}
  td{padding:10px; border-bottom:1px solid var(--border); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600;}
  .bar-track{height:7px; border-radius:99px; background:var(--surface-2); overflow:hidden; width:100%;}
  .bar-fill{height:100%; background:var(--accent); border-radius:99px;}

  .section-title{display:flex; align-items:center; justify-content:space-between; margin:26px 0 10px; gap:10px; flex-wrap:wrap;}
  .section-title h3{margin:0; font-size:15px;}
  .grid-2{display:grid; grid-template-columns:1.1fr .9fr; gap:16px;}
  @media (max-width:900px){ .grid-2{grid-template-columns:1fr;} }

  /* ---------- forms / modal ---------- */
  .overlay{position:fixed; inset:0; background:rgba(16,30,26,.45); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:50;}
  .modal{background:var(--surface); border-radius:14px; width:100%; max-width:480px; padding:20px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow);}
  .modal h3{margin:0;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; color:var(--muted); font-weight:500;}
  .field input, .field select, .field textarea{
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13.5px; background:var(--surface); color:var(--ink); width:100%;
  }
  .field textarea{resize:vertical; min-height:60px; font-family:inherit;}
  .row{display:flex; gap:10px;}
  .row > *{flex:1;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:6px;}
  .item-row{display:flex; gap:8px; align-items:center;}
  .item-row input{flex:1;}

  form-inline{display:block;}
  .form-card{padding:16px;}

  .empty-state{padding:30px 10px; text-align:center; color:var(--muted); font-size:13.5px;}

  pre.orc-text{white-space:pre-wrap; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px; line-height:1.55;}

  .cal-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:var(--shadow);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-wd{text-align:center; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-ink); font-weight:700; padding:6px 0; background:var(--ink); border-radius:6px;}
  .cal-cell{background:var(--surface-2); border:1px solid var(--border); border-radius:9px; min-height:64px; padding:5px; display:flex; flex-direction:column; gap:3px;}
  .cal-cell.cal-empty{background:transparent; border:none;}
  .cal-cell.cal-today{background:var(--ink); border-color:var(--ink);}
  .cal-daynum{font-size:11px; font-weight:700; color:var(--muted);}
  .cal-today .cal-daynum{color:var(--accent-ink);}
  .cal-ev{font-size:9.5px; line-height:1.25; padding:2px 4px; border-radius:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cal-more{font-size:9.5px; color:var(--muted); padding:0 4px;}
  .cal-today .cal-more{color:var(--accent-ink);}
  @media (max-width:640px){ .cal-cell{min-height:44px;} .cal-ev{display:none;} .cal-cell.cal-today .cal-ev:first-child{display:block;} }

  .calc-pad{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:320px;}
  .calc-pad button{padding:14px 0; font-size:18px; line-height:1; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer;}
  .calc-pad button:hover{background:var(--surface-2);}
  .calc-pad button.calc-op{background:var(--accent); border-color:var(--accent); font-weight:700; font-size:20px; color:var(--accent-ink);}
  .calc-pad button.calc-op:hover{filter:brightness(1.08);}
  .calc-pad button.calc-eq{background:var(--ink); border-color:var(--ink); color:var(--bg); font-weight:700; font-size:20px;}
  .calc-display{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:26px; text-align:right; padding:14px 16px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; margin-bottom:10px; max-width:320px; overflow-x:auto; white-space:nowrap;}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:99px; font-size:13px; box-shadow:var(--shadow); z-index:80; opacity:0; pointer-events:none; transition:opacity .2s;}
  .toast.show{opacity:1;}

  .btn-hamburger{
    display:none; border:1px solid var(--border); background:var(--surface); color:var(--ink);
    border-radius:8px; width:38px; height:38px; align-items:center; justify-content:center;
    font-size:19px; line-height:1; cursor:pointer; flex:none;
  }
  .btn-hamburger:hover{background:var(--surface-2);}

  @media (max-width:760px){
    .app{flex-direction:column;}
    .sidebar{
      width:100%; flex-direction:row; align-items:center; justify-content:space-between;
      padding:12px 14px; gap:10px; position:relative; flex-wrap:nowrap;
    }
    .btn-hamburger{display:flex;}
    .side-summary{display:none;}
    nav.tabs{
      display:none;
      position:absolute; top:100%; left:14px; right:14px; margin-top:8px;
      background:var(--surface); border:1px solid var(--border); border-radius:12px;
      flex-direction:column; gap:2px; padding:8px; z-index:60; box-shadow:var(--shadow);
      max-height:70vh; overflow-y:auto;
    }
    .sidebar.menu-open nav.tabs{display:flex;}
    .tab-btn{padding:11px 12px;}
    .tab-btn span.label-full{display:inline;}
    .topbar{padding:16px 16px 4px;}
    #view{padding:12px 16px 32px;}
    .board{grid-template-columns:1fr; }
  }
</style>

<div class="login-gate" id="loginGate" style="display:none;">
  <div class="card login-card">
    <div class="brand">
      <div class="brand-mark">🪢</div>
      <div>
        <div class="brand-name">Stylo Fibra</div>
        <div class="brand-sub">central de vendas</div>
      </div>
    </div>
    <p>Entra com o e-mail e senha cadastrados pra acessar os dados da loja.</p>
    <div class="field"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="username" placeholder="voce@email.com"></div>
    <div class="field"><label>Senha</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <div id="loginError"></div>
    <button class="btn btn-primary" id="btnLoginSubmit">Entrar</button>
  </div>
</div>
<div class="app" id="appRoot">
  <aside class="sidebar" id="sidebarEl">
    <div class="brand">
      <div class="brand-mark">🪢</div>
      <div>
        <div class="brand-name">Stylo Fibra</div>
        <div class="brand-sub">central de vendas</div>
      </div>
    </div>
    <button class="btn-hamburger" id="btnHamburger" aria-label="Abrir menu">☰</button>
    <nav class="tabs" id="nav"></nav>
    <div class="side-summary" id="sideSummary"></div>
  </aside>
  <main>
    <div class="topbar">
      <h1 id="pageTitle">Pipeline</h1>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="conn-status" id="connStatus" style="display:none;"></span>
        <button class="btn btn-sm btn-ghost" id="btnLogout" style="display:none;">Sair</button>
        <div class="date" id="pageDate"></div>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<div id="qrHidden" style="position:fixed; left:-9999px; top:-9999px; width:160px; height:160px;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------------- config ----------------
  var STAGES = [
    {id:"quente", label:"Quente", color:"var(--st-quente)"},
    {id:"morno", label:"Morno", color:"var(--st-morno)"},
    {id:"frio", label:"Frio", color:"var(--st-frio)"},
    {id:"fechado", label:"Fechado", color:"var(--st-fechado)"},
    {id:"posvenda", label:"Pós-venda", color:"var(--st-posvenda)"}
  ];
  var STAGE_MAP = {}; STAGES.forEach(function(s){ STAGE_MAP[s.id]=s; });

  var LOG_STATUS = [
    {id:"a_programar", label:"A programar", color:"var(--st-frio)"},
    {id:"agendada", label:"Agendada", color:"var(--st-morno)"},
    {id:"a_caminho", label:"A caminho", color:"var(--accent)"},
    {id:"entregue", label:"Entregue", color:"var(--st-fechado)"}
  ];
  var LOG_STATUS_MAP = {}; LOG_STATUS.forEach(function(s){ LOG_STATUS_MAP[s.id]=s; });

  var CONTENT_TIPOS = ["Foto de produto","Depoimento","Bastidor/produção","Promoção","Outro"];

  var MATERIAL_CATEGORIAS = ["Fibra sintética","Ferro galvanizado","Tecido","Espuma/Enchimento","Corda náutica","Outro"];
  var MATERIAL_COR = {
    "Fibra sintética":"var(--accent)", "Ferro galvanizado":"var(--st-frio)", "Tecido":"var(--st-posvenda)",
    "Espuma/Enchimento":"var(--st-morno)", "Corda náutica":"var(--accent-2)", "Outro":"var(--muted)"
  };

  var TABS = [
    {id:"painel", label:"Painel", ico:"◈"},
    {id:"pipeline", label:"Pipeline", ico:"◆"},
    {id:"reengajar", label:"Reengajar", ico:"↻"},
    {id:"orcamentos", label:"Orçamentos", ico:"◧"},
    {id:"logistica", label:"Logística", ico:"▣"},

  // Adapta o cliente supabase-js pra ter a mesma "forma" da capacidade
  // window.claude.use("db") que o resto do sistema já usa — assim docSet/docUpdate/
  // docDelete/subscribeCollection não precisam mudar nada.
  function makeSupabaseDb(client){
    var listeners = {}; // col -> {cb, errCb, timer}

    function fetchCollection(col){
      return client.from(SUPABASE_TABLE).select("doc_id,data").eq("collection", col)
        .then(function(res){
          if (res.error) throw res.error;
          return res.data || [];
        });
    }
    function notify(col){
      var l = listeners[col];
      if (!l) return Promise.resolve();
      return fetchCollection(col).then(function(rows){
        // Formato compatível com o snapshot do Firestore que subscribeCollection já espera
        // (snap.docs.forEach(d => d.id / d.data())), assim não precisamos mexer nessa função.
        var docs = rows.map(function(r){
          return { id: r.doc_id, data: function(){ return r.data; } };
        });
        l.cb({ docs: docs });
      }).catch(function(err){
        console.error("supabase fetch error on "+col, err);
        if (l.errCb) l.errCb(err);
      });
    }
    function upsertDoc(col, id, data){
      return client.from(SUPABASE_TABLE)
        .upsert({collection:col, doc_id:id, data:data, updated_at:new Date().toISOString()}, {onConflict:"collection,doc_id"})
        .then(function(res){ if (res.error) throw res.error; return notify(col); });
    }

    return {
      collection: function(col){
        return {
          doc: function(id){
            return {
              set: function(data){ return upsertDoc(col, id, data); },
              update: function(data){
                return client.from(SUPABASE_TABLE).select("data").eq("collection", col).eq("doc_id", id).maybeSingle()
                  .then(function(res){
                    if (res.error) throw res.error;
                    var merged = Object.assign({}, (res.data && res.data.data) || {}, data);
                    return upsertDoc(col, id, merged);
                  });
              },
              delete: function(){
                return client.from(SUPABASE_TABLE).delete().eq("collection", col).eq("doc_id", id)
                  .then(function(res){ if (res.error) throw res.error; return notify(col); });
              }
            };
          },
          onSnapshot: function(cb, errCb){
            listeners[col] = {cb:cb, errCb:errCb};
            notify(col);
            var timer = setInterval(function(){ notify(col); }, 20000);
            listeners[col].timer = timer;
            return function(){ clearInterval(timer); delete listeners[col]; };
          }
        };
      }
    };
  }

  function makeSupabaseAssets(client){
    return {
      upload: function(file){
        var ext = (file.name && file.name.lastIndexOf(".") > -1) ? file.name.slice(file.name.lastIndexOf(".")) : "";
        var path = Date.now()+"-"+Math.random().toString(36).slice(2,8)+ext;
        return client.storage.from(SUPABASE_BUCKET).upload(path, file, {upsert:false})
          .then(function(res){
            if (res.error) throw res.error;
            var pub = client.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
            return { id: path, url: pub.data.publicUrl };
          });
      }
    };
  }

  function makeBrowserDownloads(){
    return {
      save: function(opts){
        return new Promise(function(resolve){
          var blobUrl = URL.createObjectURL(opts.data);
          var a = document.createElement("a");

          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 4000);
          resolve({ok:true});
        });
      }
    };
  }

  function docSet(col, id, data){
    if (mode === "db") {

  }
  function docUpdate(col, id, data){
    if (mode === "db") {
      return db.collection(col).doc(id).update(data).catch(function(e){
        console.error(e); showToast("Não deu pra atualizar agora, tenta de novo.");
      });
    } else {
      var cur = state[col].get(id) || {id:id};
      state[col].set(id, Object.assign({}, cur, data));
      render();
      return Promise.resolve();
    }
  }
  function docDelete(col, id){
    if (mode === "db") {
      return db.collection(col).doc(id).delete().catch(function(e){
        console.error(e); showToast("Não deu pra excluir agora, tenta de novo.");

  }

  function snapshotKey(m){
    // Assinatura estável de um Map (ordenada por id) pra saber se os dados
    // realmente mudaram — evita redesenhar a tela (e apagar o que a pessoa
    // está digitando) quando o "ping" periódico do Supabase traz os mesmos dados de sempre.
    var ids = Array.from(m.keys()).sort();
    return JSON.stringify(ids.map(function(id){ return [id, m.get(id)]; }));
  }

  function subscribeCollection(col){
    var unsub = db.collection(col).onSnapshot(function(snap){
      var m = new Map();
      snap.docs.forEach(function(d){ m.set(d.id, Object.assign({id:d.id}, d.data())); });
      var mudou = snapshotKey(state[col]) !== snapshotKey(m);
      state[col] = m;
      if (mudou) render();
    }, function(err){
      console.error("db error on "+col, err);
      if (mode === "db") showToast("Conexão com os dados caiu — tenta recarregar.");
    });
    unsubs.push(unsub);
  }

  function initDb(){
    if (window.claude && window.claude.use) {
      // Rodando dentro do Claude — usa as capacidades nativas, comportamento original.
      Promise.resolve(window.claude.use("db"))
        .then(function(handle){
          if (handle) {
            db = handle;
            mode = "db";
            COLLECTIONS.forEach(subscribeCollection);
          } else {
            mode = "local";
          }
          render();
        })
        .catch(function(){ mode = "local"; render(); });
      Promise.resolve(window.claude.use("assets"))
        .then(function(handle){ assets = handle; render(); })
        .catch(function(){ assets = null; });
      Promise.resolve(window.claude.use("downloads"))
        .then(function(handle){ downloadsCap = handle; render(); })
        .catch(function(){ downloadsCap = null; });
      return;
    }

    if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
      // Rodando fora do Claude (ex: Vercel) — usa o Supabase como backend real,
      // escondido atrás de login: ninguém vê ou edita dados sem e-mail/senha cadastrados.
      showLoginGate();
      try {
        supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        supaClient.auth.onAuthStateChange(function(_event, session){
          if (session) { hideLoginGate(); startAuthedApp(supaClient); }
          else { stopAuthedApp(); showLoginGate(); }
        });
      } catch (e) {
        console.error("Falha ao iniciar o Supabase", e);
        mode = "local";
        render();
      }
      return;
    }

    mode = "local";
    render();
  }

  function startAuthedApp(client){
    unsubs.forEach(function(u){ u && u(); });
    unsubs = [];
    db = makeSupabaseDb(client);
    mode = "db";
    COLLECTIONS.forEach(subscribeCollection);
    assets = makeSupabaseAssets(client);
    downloadsCap = makeBrowserDownloads();
    render();
  }

  function stopAuthedApp(){
    unsubs.forEach(function(u){ u && u(); });

      supaClient.auth.signInWithPassword({ email: email, password: senha })

          btn.disabled = false; btn.textContent = "Entrar";

        .catch(function(){
          btn.disabled = false; btn.textContent = "Entrar";
          errEl.textContent = "Não deu pra entrar agora, tenta de novo.";
        });

    btn.addEventListener("click", submit);
    pass.addEventListener("keydown", function(e){ if (e.key === "Enter") submit(); });

  // ---------- Pipeline ----------
  function leadsPerDayHtml(leads){
    var days = 14;
    var counts = [];
    var today = new Date(); today.setHours(0,0,0,0);
    for (var i=days-1; i>=0; i--){
      var d = new Date(today.getTime() - i*86400000);
      var iso = d.toISOString().slice(0,10);
      counts.push({date: iso, label: d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}), count:0});
    }
    var idxByDate = {}; counts.forEach(function(c,i){ idxByDate[c.date]=i; });
    leads.forEach(function(l){
      if (!l.criadoEm) return;
      var iso = String(l.criadoEm).slice(0,10);
      if (idxByDate.hasOwnProperty(iso)) counts[idxByDate[iso]].count++;
    });
    var max = Math.max.apply(null, counts.map(function(c){ return c.count; }).concat([1]));
    var total = counts.reduce(function(s,c){ return s+c.count; }, 0);
    var bars = counts.map(function(c){
      var h = c.count>0 ? Math.round((c.count/max)*54)+6 : 2;
      return '<div class="bar" style="height:'+h+'px;" title="'+c.label+': '+c.count+'">'+
        (c.count>0 ? '<span class="tip">'+c.count+'</span>' : '')+
        '</div>';
    }).join("");
    var labels = counts.filter(function(c,i){ return i%2===0 || i===counts.length-1; })
      .map(function(c){ return '<span>'+c.label+'</span>'; }).join("");
    return '<div class="card" style="padding:14px 16px; margin-bottom:14px;">'+
      '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">'+
        '<span style="font-size:12.5px; color:var(--muted);">Contatos novos — últimos 14 dias</span>'+
        '<span style="font-size:13px; font-weight:600;">'+total+' no total</span>'+
      '</div>'+
      '<div class="leadchart">'+bars+'</div>'+
      '<div class="leadchart-labels">'+labels+'</div>'+
    '</div>';
  }

  function renderPipeline(){
    var leads = Array.from(state.leads.values());
    var chart = leadsPerDayHtml(leads);
    var cols = STAGES.map(function(st){
      var items = sortByField(leads.filter(function(l){ return l.estagio===st.id; }), "valor", "desc");
      var cards = items.length ? items.map(leadCardHtml).join("") :

      return '<div class="col">'+
        '<div class="col-head"><span class="stage-dot" style="background:'+st.color+'"></span>'+
        '<span class="label">'+st.label+'</span><span class="count">'+items.length+'</span></div>'+
        cards+
        '</div>';
    }).join("");

    return chart+
      '<div class="pipeline-head">'+
      '<div style="color:var(--muted); font-size:13px;">Toque num lead pra editar ou mudar de etapa.</div>'+
      '<button class="btn btn-primary" id="btnNovoLead">+ Novo lead</button>'+
      '</div>'+
      '<div class="board">'+cols+'</div>';
  }

  function openBulkImportForm(){
    openModal(bulkImportFormHtml());
    document.getElementById("btnCancel").addEventListener("click", closeModal);
    document.getElementById("btnSalvarBulk").addEventListener("click", function(){
      var raw = document.getElementById("bulkInput").value;
      var linhas = raw.split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
      if (!linhas.length) { showToast("Cola pelo menos um contato."); return; }
      var now = new Date().toISOString();
      var registros = linhas.map(function(linha){
        var partes = linha.split(/,|\t|-(?!\d)/).map(function(s){ return s.trim(); }).filter(Boolean);
        var nome, whatsapp = "";
        if (partes.length > 1) {
          nome = partes[0];
          for (var i=1;i<partes.length;i++){
            var digits = partes[i].replace(/\D/g,"");
            if (digits.length>=8) { whatsapp = digits; break; }
          }
        } else {
          // sem vírgula/traço separando — tenta separar "Nome 91987654321" pelo espaço antes do número
          var m = linha.match(/^(.*?)\s+([\d][\d\s\-\(\)]{6,}\d)$/);
          if (m && m[1]) {
            nome = m[1].trim();
            whatsapp = m[2].replace(/\D/g,"");
          } else {
            var onlyPhoneChars = linha.replace(/[\d\s\-\+\(\)]/g,"") === "";
            var soDigitos = linha.replace(/\D/g,"");
            if (onlyPhoneChars && soDigitos.length>=8) {
              nome = linha; whatsapp = soDigitos;
            } else {
              nome = linha; whatsapp = "";
            }
          }
        }
        return {nome:nome, whatsapp:whatsapp, produto:"", valor:0, estagio:"frio", origem:"Contato salvo (WhatsApp)", notas:"", criadoEm:now, atualizadoEm:now};
      });
      Promise.all(registros.map(function(r){ return docAdd("leads", r); })).then(function(){
        showToast(registros.length+" contato"+(registros.length===1?"":"s")+" importado"+(registros.length===1?"":"s")+".");
        closeModal();
        render();
      });
    });
  }

  // ---------- Painel (desempenho) ----------
  function getMetas(){ return state.settings.get("metas") || {}; }

  function computeTicketMedio(leads){
    var m = getMetas();
    if (m.ticketMedioManual) return Number(m.ticketMedioManual);
    var fechados = leads.filter(function(l){ return (l.estagio==="fechado"||l.estagio==="posvenda") && Number(l.valor)>0; });
    if (!fechados.length) return 0;
    var total = fechados.reduce(function(s,l){ return s+Number(l.valor); }, 0);
    return total / fechados.length;
  }

  function computeCustoBloco(){
    var m = getMetas();
    var leads = Array.from(state.leads.values());
    var ticketMedio = computeTicketMedio(leads);
    var metaFaturamento = Number(m.metaFaturamento)||0;
    var verbaTrafego = Number(m.verbaTrafego)||0;
    var vendasNecessarias = ticketMedio>0 ? Math.ceil(metaFaturamento/ticketMedio) : 0;
    var cacAlvo = vendasNecessarias>0 ? verbaTrafego/vendasNecessarias : 0;

    var camps = Array.from(state.campaigns.values());
    var mesAtual = new Date().toISOString().slice(0,7);
    var campsMes = camps.filter(function(c){ return c.periodoInicio && String(c.periodoInicio).slice(0,7)===mesAtual; });
    var gastoMes = campsMes.reduce(function(s,c){ return s+(Number(c.gastoTotal)||0); }, 0);
    var vendasMes = campsMes.reduce(function(s,c){ return s+(Number(c.vendasFechadas)||0); }, 0);
    var cacRealMes = vendasMes>0 ? gastoMes/vendasMes : null;
    var restanteMes = verbaTrafego - gastoMes;

    return {
      ticketMedio: ticketMedio, metaFaturamento: metaFaturamento, verbaTrafego: verbaTrafego,
      vendasNecessarias: vendasNecessarias, cacAlvo: cacAlvo,
      gastoMes: gastoMes, vendasMes: vendasMes, cacRealMes: cacRealMes, restanteMes: restanteMes,
      ticketAuto: !m.ticketMedioManual
    };
  }

  function computeCriativosRanking(){
    var criativos = Array.from(state.criativos.values());
    var comDados = criativos.filter(function(c){ return c.cpa || c.taxaConversao; });
    return comDados.slice().sort(function(a,b){
      var scoreA = (Number(a.taxaConversao)||0) - (Number(a.cpa)||0)/100;
      var scoreB = (Number(b.taxaConversao)||0) - (Number(b.cpa)||0)/100;
      return scoreB - scoreA;
    });
  }

  function computePontuacaoTrafego(custo){
    var cacScore = null;
    if (custo.cacAlvo>0 && custo.cacRealMes!=null) {
      cacScore = custo.cacRealMes<=custo.cacAlvo ? 100 : Math.max(0, Math.round(100*(custo.cacAlvo/custo.cacRealMes)));
    }
    var camps = Array.from(state.campaigns.values()).filter(function(c){ return Number(c.impressoes)>0; });
    var ctrScore = null;
    if (camps.length) {
      var ctrMedio = camps.reduce(function(s,c){ return s + (Number(c.cliques)/Number(c.impressoes)*100); }, 0) / camps.length;
      ctrScore = Math.min(100, Math.round((ctrMedio/1.5)*100));
    }
    var criativosComConv = Array.from(state.criativos.values()).filter(function(c){ return Number(c.taxaConversao)>0; });
    var convScore = null;
    if (criativosComConv.length) {
      var convMedia = criativosComConv.reduce(function(s,c){ return s+Number(c.taxaConversao); }, 0) / criativosComConv.length;
      convScore = Math.min(100, Math.round((convMedia/5)*100));
    }
    var partes = [];
    if (cacScore!=null) partes.push({v:cacScore, w:0.6});
    if (ctrScore!=null) partes.push({v:ctrScore, w:0.2});
    if (convScore!=null) partes.push({v:convScore, w:0.2});
    var pontuacao = null;
    if (partes.length) {
      var wTotal = partes.reduce(function(s,p){return s+p.w;},0);
      pontuacao = Math.round(partes.reduce(function(s,p){return s+p.v*p.w;},0)/wTotal);
    }
    return {pontuacao: pontuacao, cacScore: cacScore, ctrScore: ctrScore, convScore: convScore};
  }

  function computePontuacaoComercial(){
    var leads = Array.from(state.leads.values());
    var totalLeads = leads.length;
    var fechados = leads.filter(function(l){ return l.estagio==="fechado"||l.estagio==="posvenda"; }).length;
    var taxaFechamento = totalLeads>0 ? (fechados/totalLeads*100) : null;
    var fechamentoScore = taxaFechamento!=null ? Math.min(100, Math.round(taxaFechamento*100/25)) : null;

    var comTempo = leads.filter(function(l){ return Number(l.tempoRespostaMin)>0; });
    var tempoScore = null;
    if (comTempo.length) {
      var tempoMedio = comTempo.reduce(function(s,l){ return s+Number(l.tempoRespostaMin); }, 0)/comTempo.length;
      tempoScore = tempoMedio<=15 ? 100 : Math.max(0, Math.round(100 - (tempoMedio-15)*1.5));
    }

    var friosMornos = leads.filter(function(l){ return l.estagio==="frio"||l.estagio==="morno"; });
    var followUpScore = null;
    if (friosMornos.length) {
      var recentes = friosMornos.filter(function(l){ var d=daysSince(l.atualizadoEm||l.criadoEm); return d!=null && d<=30; });
      followUpScore = Math.round(recentes.length/friosMornos.length*100);
    }

    var partes = [];
    if (fechamentoScore!=null) partes.push({v:fechamentoScore, w:0.6});
    if (tempoScore!=null) partes.push({v:tempoScore, w:0.2});
    if (followUpScore!=null) partes.push({v:followUpScore, w:0.2});
    var pontuacao = null;
    if (partes.length) {
      var wTotal = partes.reduce(function(s,p){return s+p.w;},0);
      pontuacao = Math.round(partes.reduce(function(s,p){return s+p.v*p.w;},0)/wTotal);
    }
    return {pontuacao: pontuacao, taxaFechamento: taxaFechamento, fechamentoScore: fechamentoScore, tempoScore: tempoScore, followUpScore: followUpScore};
  }

  function renderPainel(){
    var custo = computeCustoBloco();
    var trafego = computePontuacaoTrafego(custo);
    var comercial = computePontuacaoComercial();
    var ranking = computeCriativosRanking();
    var m = getMetas();
    var semMetas = !custo.metaFaturamento && !custo.verbaTrafego;

    function scoreColor(v){
      if (v==null) return "var(--muted)";
      return v>=70 ? "var(--st-fechado)" : (v>=40 ? "var(--st-morno)" : "var(--st-quente)");
    }
    function scoreTile(titulo, obj, detalhes){
      var cor = scoreColor(obj.pontuacao);
      return '<div class="card" style="padding:16px; flex:1; min-width:220px;">'+
        '<div style="font-size:12.5px; color:var(--muted); margin-bottom:6px;">'+titulo+'</div>'+
        '<div style="font-size:34px; font-weight:700; color:'+cor+';">'+(obj.pontuacao!=null?obj.pontuacao:"—")+
          (obj.pontuacao!=null?'<span style="font-size:15px;color:var(--muted);"> /100</span>':'')+'</div>'+
        '<div style="font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.6;">'+detalhes+'</div>'+
      '</div>';
    }

    var trafegoDetalhes = [
      trafego.cacScore!=null ? "CAC vs meta: "+trafego.cacScore+" pts" : "CAC vs meta: sem venda registrada este mês ainda",
      trafego.ctrScore!=null ? "CTR médio: "+trafego.ctrScore+" pts" : "CTR: preenche impressões/cliques nas campanhas",
      trafego.convScore!=null ? "Conversão de criativos: "+trafego.convScore+" pts" : "Conversão de criativos: sem dados ainda"
    ].join("<br>");

    var comercialDetalhes = [
      comercial.fechamentoScore!=null ? "Taxa de fechamento: "+comercial.taxaFechamento.toFixed(0)+"% ("+comercial.fechamentoScore+" pts)" : "Taxa de fechamento: sem leads ainda",
      comercial.tempoScore!=null ? "Tempo de resposta: "+comercial.tempoScore+" pts" : "Tempo de resposta: preenche no cadastro do lead",
      comercial.followUpScore!=null ? "Follow-up ativo: "+comercial.followUpScore+" pts" : "Follow-up: sem leads frio/morno ainda"
    ].join("<br>");

    var alerta = "";
    if (comercial.pontuacao!=null && comercial.pontuacao<40) {
      alerta = '<div class="card" style="padding:12px 16px; margin-bottom:14px; border-left:4px solid var(--st-quente);">'+
        '<b style="color:var(--st-quente)">Foco em vendas, não em tráfego agora:</b> sua pontuação comercial tá abaixo de 40 — antes de investir mais em anúncio, vale ajustar o fechamento e o follow-up dos leads que já estão na carteira.'+
      '</div>';
    }

    var custoRows = [
      ["Meta de faturamento (mês)", fmtBRL(custo.metaFaturamento)],
      ["Verba de tráfego (mês)", fmtBRL(custo.verbaTrafego)],
      ["Ticket médio"+(custo.ticketAuto?" (calculado)":" (manual)"), fmtBRL(custo.ticketMedio)],
      ["Vendas necessárias no mês", custo.vendasNecessarias || "—"],
      ["CAC-alvo (teto por venda)", custo.cacAlvo ? fmtBRL(custo.cacAlvo) : "—"],
      ["Gasto em tráfego este mês", fmtBRL(custo.gastoMes)],
      ["CAC real este mês", custo.cacRealMes!=null ? fmtBRL(custo.cacRealMes) : "sem venda registrada ainda"],
      ["Ainda pode gastar este mês", fmtBRL(custo.restanteMes)]
    ];
    var cacCor = (custo.cacRealMes!=null && custo.cacAlvo>0) ? (custo.cacRealMes<=custo.cacAlvo ? "var(--st-fechado)" : "var(--st-quente)") : "var(--ink)";

    var custoHtml = '<div class="card" style="padding:16px;">'+
      '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px;">'+
        '<h3 style="margin:0;">Custo por venda</h3>'+
        '<button class="btn btn-ghost btn-sm" id="btnEditarMetas">Editar metas</button>'+
      '</div>'+
      (!semMetas ?
        '<table style="width:100%; font-size:13px;"><tbody>'+
          custoRows.map(function(r,i){
            var isCac = i===6;
            return '<tr><td style="padding:5px 0; color:var(--muted);">'+r[0]+'</td><td style="padding:5px 0; text-align:right; font-weight:600; '+(isCac?'color:'+cacCor+';':'')+'">'+r[1]+'</td></tr>';
          }).join("")+
        '</tbody></table>' :
        '<div class="empty-state">Ainda sem meta cadastrada — preenche meta de faturamento e verba de tráfego do mês ali embaixo.</div>')+
    '</div>';

    var allCriativos = sortByField(Array.from(state.criativos.values()), "criadoEm", "desc");
    var top3 = ranking.slice(0,3);
    var usandoRanking = top3.length > 0;
    var itensExibir = usandoRanking ? top3 : allCriativos.slice(0,3);
    var criativosHtml = '<div class="card" style="padding:16px;">'+
      '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px;">'+
        '<h3 style="margin:0;">Criativos em destaque</h3>'+
        (itensExibir.length ? '<span style="font-size:11px; color:var(--muted);">toque pra editar</span>' : '')+
      '</div>'+
      (itensExibir.length ?
        '<div style="display:flex; flex-direction:column; gap:10px;">'+
          itensExibir.map(function(c,i){
            var thumbSrc = c.imagemUrl ? c.imagemUrl : (c.imagemId ? '/_blob/'+esc(c.imagemId) : null);
            var temDados = c.cpa || c.taxaConversao;
            return '<div data-id="'+c.id+'" data-action="edit-criativo-painel" style="display:flex; align-items:center; gap:10px; cursor:pointer;">'+
              (usandoRanking ? '<span style="font-weight:700; color:var(--accent-2); width:16px; flex:none;">#'+(i+1)+'</span>' : '')+
              (thumbSrc ? '<img src="'+thumbSrc+'" style="width:36px;height:36px;object-fit:cover;border-radius:7px;border:1px solid var(--border); flex:none;">' : '<div style="width:36px;height:36px;border-radius:7px;background:var(--surface-2); flex:none;"></div>')+
              '<div style="flex:1; min-width:0;">'+
                '<div style="font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+esc(c.titulo||"Sem título")+'</div>'+
                '<div style="font-size:11.5px; color:var(--muted);">'+(temDados ? ((c.cpa?fmtBRL(c.cpa)+" CPA":"")+(c.cpa&&c.taxaConversao?" · ":"")+(c.taxaConversao?c.taxaConversao+"% conv.":"")) : "sem dados ainda — toque pra registrar")+'</div>'+
              '</div>'+
            '</div>';
          }).join("")+
        '</div>' :
        '<div class="empty-state">Nenhum criativo cadastrado ainda — cria o primeiro na aba Criativos.</div>')+
    '</div>';

    var produtoStats = computeProdutoStats();
    var temMargemPainel = produtoStats.some(function(p){ return Number(p.margemPct)>0; });
    var produtoRankKey = temMargemPainel ? "lucroEstimado" : "receita";
    var produtoTop = sortByField(produtoStats, produtoRankKey, "desc").filter(function(p){ return p[produtoRankKey]>0; })[0];
    // sem venda casada ainda? mostra o primeiro produto do catálogo mesmo assim, pra sempre dar um jeito de abrir e anexar foto
    var produtoFallback = !produtoTop && produtoStats.length ? produtoStats[0] : null;
    var produtoExibir = produtoTop || produtoFallback;
    var produtoHtml = '<div class="card" style="padding:16px;">'+
      '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px;">'+
        '<h3 style="margin:0;">Produto pra priorizar</h3>'+
        (produtoExibir ? '<span style="font-size:11px; color:var(--muted);">toque pra editar</span>' : '')+
      '</div>'+
      (produtoExibir ?
        (function(){
          var thumbSrc = produtoExibir.imagemUrl ? produtoExibir.imagemUrl : (produtoExibir.imagemId ? '/_blob/'+esc(produtoExibir.imagemId) : null);
          var thumb = thumbSrc ? '<img src="'+thumbSrc+'" style="width:40px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--border); flex:none;">' : '<div style="width:40px;height:40px;border-radius:8px;background:var(--surface-2); flex:none;"></div>';
          var subtitulo = produtoTop ?
            (produtoExibir.vendas+' venda'+(produtoExibir.vendas===1?"":"s")+' · '+fmtBRL(produtoExibir.receita)+' em receita'+(temMargemPainel?' · '+fmtBRL(produtoExibir.lucroEstimado)+' lucro est.':'')) :
            (thumbSrc ? "ainda sem venda casada" : "toque pra anexar a foto");
          return '<div data-id="'+produtoExibir.id+'" data-action="edit-produto-painel" style="cursor:pointer; display:flex; gap:10px; align-items:center;">'+
            thumb+
            '<div>'+
              '<div style="font-size:13px; font-weight:600;">'+esc(produtoExibir.nome)+'</div>'+
              '<div style="font-size:11.5px; color:var(--muted); margin-top:2px;">'+subtitulo+'</div>'+
            '</div>'+
          '</div>';
        })() :
        '<div class="empty-state">Cadastra seu catálogo (aba Mix de produto) que eu cruzo com as vendas fechadas.</div>')+
    '</div>';

    var metasFormHtml = '<div class="card form-card" id="metasFormBox" style="'+(semMetas?"":"display:none;")+' margin-bottom:16px;">'+
      '<h3 style="margin-top:0">Metas do mês</h3>'+
      '<div class="row">'+
        '<div class="field"><label>Meta de faturamento bruto (R$)</label><input id="mtFaturamento" type="number" step="0.01" value="'+(m.metaFaturamento!=null?m.metaFaturamento:"")+'"></div>'+
        '<div class="field"><label>Verba de tráfego disponível (R$)</label><input id="mtVerba" type="number" step="0.01" value="'+(m.verbaTrafego!=null?m.verbaTrafego:"")+'"></div>'+
      '</div>'+
      '<div class="field"><label>Ticket médio manual (opcional — em branco, calculo pela média dos seus fechados)</label><input id="mtTicket" type="number" step="0.01" value="'+(m.ticketMedioManual!=null?m.ticketMedioManual:"")+'"></div>'+
      '<div class="modal-actions">'+(semMetas?'<span></span>':'<button class="btn btn-ghost btn-sm" id="btnCancelMetas">Cancelar</button>')+'<span style="flex:1"></span><button class="btn btn-primary btn-sm" id="btnSalvarMetas">Salvar metas</button></div>'+
    '</div>';

    return '<p style="margin:0 0 16px; font-size:13px; color:var(--muted); max-width:70ch;">Visão geral: quanto os criativos estão rendendo, quanto ainda dá pra gastar em tráfego e como está sua pontuação de tráfego x comercial.</p>'+
      metasFormHtml+
      alerta+
      '<div style="display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px;">'+
        scoreTile("Pontuação de tráfego", trafego, trafegoDetalhes)+
        scoreTile("Pontuação comercial", comercial, comercialDetalhes)+
      '</div>'+
      '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:14px;">'+custoHtml+criativosHtml+produtoHtml+'</div>';
  }

  function bindPainelEvents(){
    var btnEditar = document.getElementById("btnEditarMetas");
    if (btnEditar) btnEditar.addEventListener("click", function(){
      var box = document.getElementById("metasFormBox");
      if (box) box.style.display = box.style.display==="none" ? "block" : "none";
    });
    var btnCancel = document.getElementById("btnCancelMetas");
    if (btnCancel) btnCancel.addEventListener("click", function(){
      document.getElementById("metasFormBox").style.display = "none";
    });
    var btnSalvar = document.getElementById("btnSalvarMetas");
    if (btnSalvar) btnSalvar.addEventListener("click", function(){
      var data = {
        metaFaturamento: parseFloat(document.getElementById("mtFaturamento").value)||0,
        verbaTrafego: parseFloat(document.getElementById("mtVerba").value)||0,
        ticketMedioManual: parseFloat(document.getElementById("mtTicket").value)||0
      };
      docSet("settings", "metas", data).then(function(){ showToast("Metas salvas."); render(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-action="edit-criativo-painel"]'), function(el){
      el.addEventListener("click", function(){ openCriativoEditForm(state.criativos.get(el.dataset.id)); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-action="edit-produto-painel"]'), function(el){
      el.addEventListener("click", function(){ openProdutoForm(state.produtos.get(el.dataset.id)); });
    });
  }

  // ---------- Processo de vendas ----------
  function renderProcesso(){
    var items = FUNIL.map(function(f, i){
      var checklistHtml = f.checklist ?
        '<ul class="tl-checklist">'+f.checklist.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join("")+'</ul>' : "";
      return '<div class="tl-item">'+
        '<div class="tl-num">'+(i+1)+'</div>'+
        '<div class="tl-body">'+
          '<h4>'+esc(f.titulo)+' <span class="tl-badge">'+esc(f.tag)+'</span></h4>'+
          '<p class="obj">'+esc(f.obj)+'</p>'+
          checklistHtml+
        '</div>'+
      '</div>';
    }).join("");
    return '<div class="card" style="padding:22px 24px;">'+
      '<p style="margin:0 0 22px; font-size:13px; color:var(--muted); max-width:60ch;">O caminho que o cliente percorre até fechar — do primeiro anúncio ao pós-venda. Me chama sempre que quiser ajustar uma etapa.</p>'+
      '<div class="timeline">'+items+'</div>'+
    '</div>';
  }

  // ---------- Clientes (compradores) ----------
  function clientCardHtml(l){
    var wa = l.whatsapp ? l.whatsapp.replace(/\D/g,"") : "";
    var waLink = wa ? '<a href="https://wa.me/'+esc(wa)+'" target="_blank" rel="noopener" style="font-size:11.5px; color:var(--accent); text-decoration:underline;">Chamar no WhatsApp</a>' : "";
    return '<div class="client-card" data-id="'+l.id+'" data-action="edit-lead" style="cursor:pointer;">'+
      '<div class="nome">'+esc(l.nome)+'</div>'+
      (l.produto ? '<div class="meta">'+esc(l.produto)+'</div>' : '')+
      (l.valor ? '<div class="val money">'+fmtBRL(l.valor)+'</div>' : '<div class="meta" style="font-style:italic;">valor não informado</div>')+
      '<div class="meta">Fechado em '+(l.atualizadoEm ? fmtDate(l.atualizadoEm.slice(0,10)) : "data não informada")+'</div>'+
      (l.cidade ? '<div class="meta">📍 '+esc(l.cidade)+'</div>' : '<div class="meta" style="font-style:italic;">local de entrega não informado</div>')+
      waLink+
    '</div>';
  }

  function renderClientes(){
    var leads = Array.from(state.leads.values()).filter(function(l){ return l.estagio === "fechado"; });
    var cutoff = Date.now() - 90*24*60*60*1000;
    var ativos = [], reengajar = [];
    leads.forEach(function(l){
      var t = l.atualizadoEm ? new Date(l.atualizadoEm).getTime() : 0;
      (t >= cutoff ? ativos : reengajar).push(l);
    });
    ativos = sortByField(ativos, "atualizadoEm", "desc");
    reengajar = sortByField(reengajar, "atualizadoEm", "desc");

    var ativosHtml = ativos.length ? '<div class="client-grid">'+ativos.map(clientCardHtml).join("")+'</div>' :
      '<div class="empty-state">Nenhum comprador nos últimos 90 dias ainda.</div>';
    var reengajarHtml = reengajar.length ? '<div class="client-grid">'+reengajar.map(clientCardHtml).join("")+'</div>' :
      '<div class="empty-state">Ninguém precisando de reativação por enquanto.</div>';

    return '<p style="margin:0 0 18px; font-size:13px; color:var(--muted); max-width:60ch;">Toda vez que um lead vira "Fechado" no Pipeline, ele aparece aqui automaticamente. Toque num card pra completar produto, valor ou data.</p>'+
      '<div class="section-title" style="margin-top:0"><h3>Compradores ativos (últimos 90 dias)</h3></div>'+
      ativosHtml+
      '<div class="section-title"><h3>Reativar (sem comprar há 90+ dias)</h3></div>'+
      '<p style="margin:-4px 0 12px; font-size:12.5px; color:var(--muted);">Boa lista pra mandar novidade de coleção ou promoção pontual.</p>'+
      reengajarHtml;
  }

  // ---------- Criativos e prompts ----------
  var criativoDraftImg = null;

  function renderCriativos(){
    var criativos = sortByField(Array.from(state.criativos.values()), "criadoEm", "desc");
    var galleryHtml = criativos.length ? '<div class="gallery-grid">'+criativos.map(function(c){
      var thumbSrc = c.imagemUrl ? c.imagemUrl : (c.imagemId ? '/_blob/'+esc(c.imagemId) : null);
      var thumb = thumbSrc ? '<img class="thumb" src="'+thumbSrc+'" alt="">' : '<div class="thumb-empty">sem imagem</div>';
      var statusCores = {ativo:"var(--st-fechado)", pausado:"var(--st-morno)", vencido:"var(--st-quente)"};
      var statusLabels = {ativo:"Ativo", pausado:"Pausado", vencido:"Vencido"};
      var stCor = statusCores[c.status] || "var(--muted)";
      var perfBits = [];
      if (c.cpa) perfBits.push("CPA "+fmtBRL(c.cpa));
      if (c.taxaConversao) perfBits.push(c.taxaConversao+"% conv.");
      return '<div class="gallery-item">'+thumb+
        '<div class="meta"><span class="t">'+esc(c.titulo||"Sem título")+'</span>'+
        (c.tag ? '<span class="g">'+esc(c.tag)+'</span>' : '')+
        (c.status ? '<span class="pill" style="background:'+stCor+'22; color:'+stCor+'; align-self:flex-start;">'+statusLabels[c.status]+'</span>' : '')+
        (perfBits.length ? '<span style="font-size:11.5px; color:var(--muted);">'+perfBits.join(" · ")+'</span>' : '')+
        '<div style="display:flex; gap:6px;">'+
          '<button class="btn btn-ghost btn-sm" data-id="'+c.id+'" id="editCriativo">Editar</button>'+
          '<button class="btn btn-ghost btn-sm btn-danger" data-id="'+c.id+'" id="delCriativo">Excluir</button>'+
        '</div>'+
        '</div></div>';

        '<h3 style="margin-top:0">Novo criativo</h3>'+
        '<div class="row">'+
          '<div class="field"><label>Título</label><input id="cvTitulo" placeholder="Ex: Kit Riviera - anúncio 1"></div>'+
          '<div class="field"><label>Kit / campanha</label><input id="cvTag" placeholder="Ex: Kit Marajó"></div>'+
        '</div>'+
        '<div class="row">'+
          '<div class="field"><label>CPA (R$, opcional)</label><input id="cvCpa" type="number" step="0.01" placeholder="Custo por venda desse criativo"></div>'+
          '<div class="field"><label>Taxa de conversão (%, opcional)</label><input id="cvConv" type="number" step="0.1" placeholder="Ex: 4"></div>'+
        '</div>'+
        '<div class="row">'+
          '<div class="field"><label>Status</label><select id="cvStatus">'+
            '<option value="ativo">Ativo</option><option value="pausado">Pausado</option><option value="vencido">Vencido</option>'+
          '</select></div>'+
          '<div class="field"><label>Data de veiculação</label><input id="cvData" type="date"></div>'+
        '</div>'+
        '<p style="margin:-4px 0 8px; font-size:11.5px; color:var(--muted);">CPA e taxa de conversão são opcionais — preenchendo, o Painel monta o ranking de melhores criativos sozinho.</p>'+
        '<div class="field"><label>Imagem</label>'+
          '<div style="display:flex; align-items:center; gap:10px;">'+
            (criativoDraftImg ?
              '<img id="cvPreview" src="'+criativoDraftImg.url+'" style="width:56px;height:56px;object-fit:cover;border-radius:9px;border:1px solid var(--border);">' :
              '<div id="cvPreview" style="width:56px;height:56px;border-radius:9px;background:var(--surface-2);border:1px dashed var(--border);"></div>') +
            '<label class="btn btn-sm" style="cursor:pointer;">Escolher imagem<input type="file" id="cvImgInput" accept="image/*" style="display:none;"></label>'+
            '<span id="cvImgStatus" style="font-size:11.5px;color:var(--muted);">'+(criativoDraftImg?"Imagem pronta":"Nenhuma ainda")+'</span>'+
          '</div>'+
        '</div>'+
        '<div style="display:flex; justify-content:flex-end;"><button class="btn btn-primary" id="btnAddCriativo">Salvar criativo</button></div>'+
      '</div>') :
      '<div class="empty-state" style="margin-bottom:18px;">Upload de imagem indisponível nessa visualização.</div>';

    var prompts = sortByField(Array.from(state.prompts.values()), "criadoEm", "desc");
    var promptsHtml = prompts.length ? prompts.map(function(p){
      return '<div class="prompt-card">'+
        '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">'+
          '<h4>'+esc(p.titulo)+'</h4>'+
          '<div style="display:flex; gap:6px; flex:none;">'+
            '<button class="btn btn-ghost btn-sm" data-id="'+p.id+'" id="copyPrompt">Copiar</button>'+
            '<button class="btn btn-ghost btn-sm btn-danger" data-id="'+p.id+'" id="delPrompt">Excluir</button>'+
          '</div>'+
        '</div>'+
        '<pre>'+esc(p.texto)+'</pre>'+
      '</div>';
    }).join("") : '<div class="empty-state">Nenhum prompt salvo ainda.</div>';

    return '<div class="section-title" style="margin-top:0"><h3>Galeria de criativos</h3></div>'+
      uploadUi+
      galleryHtml+
      '<div class="section-title"><h3>Prompts salvos</h3><button class="btn btn-primary btn-sm" id="btnNovoPrompt">+ prompt</button></div>'+
      promptsHtml;
  }

  function promptFormHtml(p){
    p = p || {};
    return (p.id ? '<h3>Editar prompt</h3>' : '<h3>Novo prompt</h3>')+
      '<div class="field"><label>Título</label><input id="pTitulo" value="'+esc(p.titulo||"")+'" placeholder="Ex: Imagem Kit Riviera - praia ao pôr do sol"></div>'+
      '<div class="field"><label>Prompt / texto</label><textarea id="pTexto" style="min-height:140px;" placeholder="Cole aqui o prompt de imagem ou o roteiro de copy...">'+esc(p.texto||"")+'</textarea></div>'+

        (p.id ? '<button class="btn btn-danger btn-sm" id="btnDelPrompt">Excluir</button>' : '<span></span>')+

  // ---------- Mix de produto ----------
  function normTxt(s){
    return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
  }

  function textMatchesProduto(produtoNome, texto){
    var pn = normTxt(produtoNome);
    var tx = normTxt(texto);
    if (!pn || !tx) return false;
    if (tx.indexOf(pn) >= 0 || pn.indexOf(tx) >= 0) return true;
    var partes = tx.split(/\+|,|\/| e /).map(function(s){ return s.trim(); }).filter(Boolean);
    return partes.some(function(p){ return p.indexOf(pn) >= 0 || pn.indexOf(p) >= 0; });
  }

  function faixaDoPreco(preco){
    preco = Number(preco)||0;
    if (preco<=0) return "Sob medida";
    if (preco < 4000) return "Entrada";
    if (preco <= 6000) return "Meio";
    return "Alto";
  }

  function computeProdutoStats(){
    var produtos = Array.from(state.produtos.values());
    var leadsFechados = Array.from(state.leads.values()).filter(function(l){ return l.estagio==="fechado"||l.estagio==="posvenda"; });
    var criativos = Array.from(state.criativos.values());
    var mesAtual = new Date().toISOString().slice(0,7);
    var totalReceitaFechada = leadsFechados.reduce(function(s,l){ return s+(Number(l.valor)||0); }, 0);

    var stats = produtos.map(function(p){
      var matched = leadsFechados.filter(function(l){ return textMatchesProduto(p.nome, l.produto); });
      var matchedMes = matched.filter(function(l){ return String(l.atualizadoEm||"").slice(0,7)===mesAtual; });
      var receita = matched.reduce(function(s,l){ return s+(Number(l.valor)||0); }, 0);
      var receitaMes = matchedMes.reduce(function(s,l){ return s+(Number(l.valor)||0); }, 0);
      var vendas = matched.length;
      var vendasMes = matchedMes.length;
      var ticketMedio = vendas>0 ? receita/vendas : 0;
      var margemPct = Number(p.margemPct)||0;
      var lucroEstimado = receita * (margemPct/100);
      var pctFaturamento = totalReceitaFechada>0 ? (receita/totalReceitaFechada*100) : 0;
      var criativosVinculados = criativos.filter(function(c){ return c.tag && textMatchesProduto(p.nome, c.tag); }).length;
      var preco = p.precoMin || p.precoMax || 0;
      return Object.assign({}, p, {
        vendas:vendas, vendasMes:vendasMes, receita:receita, receitaMes:receitaMes,
        ticketMedio:ticketMedio, lucroEstimado:lucroEstimado, pctFaturamento:pctFaturamento,
        criativosVinculados:criativosVinculados, faixa: faixaDoPreco(preco)
      });
    });
    return sortByField(stats, "receita", "desc");
  }

  var FAIXA_ORDEM = {"Entrada":0, "Meio":1, "Alto":2, "Sob medida":3};
  var FAIXA_COR = {"Entrada":"var(--st-frio)", "Meio":"var(--st-morno)", "Alto":"var(--st-fechado)", "Sob medida":"var(--accent-2)"};

  function renderProdutos(){
    var stats = computeProdutoStats();
    var temMargem = stats.some(function(p){ return Number(p.margemPct)>0; });
    var rankKey = temMargem ? "lucroEstimado" : "receita";
    var ranked = sortByField(stats, rankKey, "desc");
    var statsOrdenados = stats.slice().sort(function(a,b){ return FAIXA_ORDEM[a.faixa]-FAIXA_ORDEM[b.faixa] || b.receita-a.receita; });

    var rows = statsOrdenados.length ? statsOrdenados.map(function(p){
      var preco = p.precoMin || p.precoMax || 0;
      var faixaCor = FAIXA_COR[p.faixa] || "var(--muted)";

        '<td><span class="pill" style="background:'+faixaCor+'22; color:'+faixaCor+';">'+p.faixa+'</span></td>'+
        '<td class="num">'+(preco>0?fmtBRL(preco):"sob orçamento")+'</td>'+

        '<td class="num">'+fmtBRL(p.receita)+'</td>'+
        '<td class="num">'+(p.pctFaturamento?p.pctFaturamento.toFixed(0)+"%":"—")+'</td>'+
        '<td class="num">'+(p.cacMedio?fmtBRL(p.cacMedio):"—")+'</td>'+
        '<td class="num">'+(p.criativosVinculados||"—")+'</td>'+
        '</tr>';
    }).join("") : '<tr><td colspan="8"><div class="empty-state">Nenhum produto cadastrado ainda — adiciona seu catálogo (kits/faixa de preço) pra cruzar com as vendas fechadas.</div></td></tr>';

    var destaqueThumb = destaqueThumbSrc ?
      '<img src="'+destaqueThumbSrc+'" style="width:44px;height:44px;object-fit:cover;border-radius:9px;border:1px solid var(--border); flex:none;">' :
      '<div style="width:44px;height:44px;border-radius:9px;background:var(--surface-2); flex:none;"></div>';
    var destaqueHtml = destaque ?
      '<div class="card" data-id="'+destaque.id+'" data-action="edit-produto" style="padding:14px 16px; margin-bottom:14px; border-left:4px solid var(--st-fechado); cursor:pointer; display:flex; align-items:center; gap:12px;">'+
        destaqueThumb+
        '<div style="flex:1; min-width:0;">'+
          '<b style="color:var(--st-fechado)">Produto pra priorizar no tráfego agora:</b> '+esc(destaque.nome)+
          ' — '+destaque.vendas+' venda'+(destaque.vendas===1?"":"s")+' fechada'+(destaque.vendas===1?"":"s")+
          ', '+fmtBRL(destaque.receita)+' em receita'+(temMargem?' ('+fmtBRL(destaque.lucroEstimado)+' de lucro estimado)':'')+'.'+
          '<div style="font-size:11px; color:var(--muted); margin-top:3px;">toque pra editar'+(destaqueThumbSrc?"":" e adicionar foto")+'</div>'+
        '</div>'+
      '</div>' : "";

    return '<p style="margin:0 0 16px; font-size:13px; color:var(--muted); max-width:70ch;">Cadastra o catálogo (kit, composição, peças, preço, margem e o CAC médio conforme for apurando) — eu cruzo sozinho com as vendas fechadas e com os criativos (pela tag) pra te mostrar o que compensa mais puxar no tráfego pago. Faixas: Entrada até R$3.999, Meio R$4.000–6.000, Alto acima de R$6.000.'+
        (temMargem ? '' : ' Sem margem cadastrada, o ranking usa só a receita — preenche a margem quando tiver esse número pra ficar mais preciso.')+
      '</p>'+
      destaqueHtml+
      '<div class="pipeline-head">'+
        '<div style="color:var(--muted); font-size:13px;">Toque numa linha pra editar.</div>'+
        '<button class="btn btn-primary" id="btnNovoProduto">+ Novo produto</button>'+
      '</div>'+
      '<div class="card" style="overflow-x:auto;">'+
      '<table><thead><tr><th>Produto</th><th>Faixa</th><th>Preço</th><th>Vendas</th><th>Receita</th><th>% fatur.</th><th>CAC médio</th><th>Criativos</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div>';
  }

  function computeMateriaisStats(){
    var materiais = Array.from(state.materiais.values());
    var comValor = materiais.map(function(m){
      var custoUnit = Number(m.custoUnitario)||0;
      var estoque = Number(m.quantidadeEstoque)||0;
      return Object.assign({}, m, {valorTotal: custoUnit*estoque});
    });
    var porCategoria = {};
    MATERIAL_CATEGORIAS.forEach(function(cat){ porCategoria[cat] = {categoria:cat, itens:0, valorTotal:0}; });
    comValor.forEach(function(m){
      var cat = MATERIAL_CATEGORIAS.indexOf(m.categoria)>=0 ? m.categoria : "Outro";
      porCategoria[cat].itens += 1;
      porCategoria[cat].valorTotal += m.valorTotal;
    });
    var totalGeral = comValor.reduce(function(s,m){ return s+m.valorTotal; }, 0);
    return {itens: comValor, porCategoria: porCategoria, totalGeral: totalGeral};
  }
