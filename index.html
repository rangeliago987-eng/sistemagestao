  // ---------- Calendário ----------
  var calMonthOffset = 0;
  function pad2(n){ return n<10 ? "0"+n : ""+n; }

  function computeCalendarMonth(offset){
    var base = new Date(); base.setDate(1); base.setMonth(base.getMonth()+offset);
    var year = base.getFullYear(), month = base.getMonth();
    var firstDow = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month+1, 0).getDate();
    return {year:year, month:month, firstDow:firstDow, daysInMonth:daysInMonth};
  }

  function calendarEventsByDay(){
    var map = {};
    function push(iso, label, color){
      if (!iso) return;
      if (!map[iso]) map[iso] = [];
      map[iso].push({label:label, color:color});
    }
    Array.from(state.content.values()).forEach(function(it){
      var done = it.status === "postado";
      push(it.data, "📷 "+(it.tipo||"Post")+(done?" ✓":""), done ? "var(--st-fechado)" : "var(--st-morno)");
    });
    Array.from(state.logistica.values()).forEach(function(it){
      var done = it.status === "entregue";
      push(it.dataPrevista, "🚚 "+(it.cliente||"Entrega"), done ? "var(--st-fechado)" : "var(--accent)");
    });
    return map;
  }

  function renderCalendario(){
    var mm = computeCalendarMonth(calMonthOffset);
    var events = calendarEventsByDay();
    var monthLabel = new Date(mm.year, mm.month, 1).toLocaleDateString("pt-BR",{month:"long", year:"numeric"});
    monthLabel = monthLabel.charAt(0).toUpperCase()+monthLabel.slice(1);
    var todayIso = todayISO();

    var cells = "";
    for (var i=0;i<mm.firstDow;i++) cells += '<div class="cal-cell cal-empty"></div>';
    for (var day=1; day<=mm.daysInMonth; day++){
      var iso = mm.year+"-"+pad2(mm.month+1)+"-"+pad2(day);
      var evs = events[iso]||[];
      var isToday = iso===todayIso;
      var evHtml = evs.slice(0,3).map(function(e){
        return '<div class="cal-ev" style="background:'+e.color+'22;color:'+e.color+';" title="'+esc(e.label)+'">'+esc(e.label)+'</div>';
      }).join("");
      var moreHtml = evs.length>3 ? '<div class="cal-more">+'+(evs.length-3)+'</div>' : '';
      cells += '<div class="cal-cell'+(isToday?' cal-today':'')+'"><div class="cal-daynum">'+day+'</div>'+evHtml+moreHtml+'</div>';
    }
    var weekdayHeaders = ['dom','seg','ter','qua','qui','sex','sáb'].map(function(w){ return '<div class="cal-wd">'+w+'</div>'; }).join("");

    var proximos = [];
    Object.keys(events).forEach(function(iso){
      var d = daysSince(iso);
      var diffDays = Math.round((new Date(iso+"T00:00:00").getTime() - new Date(todayIso+"T00:00:00").getTime())/86400000);
      if (diffDays>=0 && diffDays<=14) events[iso].forEach(function(e){ proximos.push({iso:iso, diffDays:diffDays, label:e.label, color:e.color}); });
    });
    proximos.sort(function(a,b){ return a.diffDays-b.diffDays; });
    var proximosHtml = proximos.length ? proximos.map(function(e){
      var quando = e.diffDays===0 ? "Hoje" : (e.diffDays===1 ? "Amanhã" : fmtDate(e.iso));
      return '<div class="side-stat"><span style="color:'+e.color+';">'+esc(e.label)+'</span><span class="v" style="font-weight:600;">'+quando+'</span></div>';
    }).join("") : '<div class="empty-state">Nada agendado nos próximos 14 dias.</div>';

    return '<p style="margin:0 0 16px; font-size:13px; color:var(--muted); max-width:70ch;">Junta os posts planejados (aba Conteúdo) e as entregas previstas (aba Logística) num só calendário — cadastra a data lá que ela aparece aqui sozinha.</p>'+
      '<div class="pipeline-head">'+
        '<div style="display:flex; align-items:center; gap:10px;">'+
          '<button class="btn btn-ghost btn-sm" id="calPrev">‹</button>'+
          '<h3 style="margin:0; min-width:170px; text-align:center;">'+monthLabel+'</h3>'+
          '<button class="btn btn-ghost btn-sm" id="calNext">›</button>'+
        '</div>'+
        '<button class="btn btn-ghost btn-sm" id="calHoje">Hoje</button>'+
      '</div>'+
      '<div class="cal-card" style="margin-bottom:20px;"><div class="cal-grid">'+weekdayHeaders+cells+'</div></div>'+
      '<div class="section-title"><h3>Próximos 14 dias</h3></div>'+
      '<div class="card" style="padding:10px 16px;">'+proximosHtml+'</div>';
  }

  // ---------- Calculadora ----------
  var calcExpr = "";
  function calcSafeEval(expr){
    expr = String(expr||"").replace(/÷/g,"/").replace(/×/g,"*").replace(/%/g,"/100");
    if (!/^[0-9+\-*/.() ]+$/.test(expr)) return null;
    try {
      var r = Function('"use strict"; return ('+expr+')')();
      return (typeof r === "number" && isFinite(r)) ? r : null;
    } catch(e){ return null; }
  }

  function renderCalculadora(){
    return '<p style="margin:0 0 18px; font-size:13px; color:var(--muted); max-width:70ch;">Ferramentas rápidas do dia a dia: simulador de orçamento (desconto à vista, entrada, parcelas) e uma calculadora simples.</p>'+
      '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:16px; align-items:start;">'+
        '<div class="card form-card">'+
          '<h3 style="margin-top:0;">Simulador de orçamento</h3>'+
          '<div class="field"><label>Valor total (R$)</label><input id="simValor" type="number" step="0.01" placeholder="Ex: 15000"></div>'+
          '<div class="row">'+
            '<div class="field"><label>Desconto à vista (%)</label><input id="simDesc" type="number" step="0.1" value="10"></div>'+
            '<div class="field"><label>Parcelas sem juros</label><input id="simParc" type="number" step="1" value="8"></div>'+
          '</div>'+
          '<div class="field"><label>Entrada (%)</label><input id="simEntrada" type="number" step="1" value="50"></div>'+
          '<div id="simResultado" class="empty-state" style="padding:16px 4px; text-align:left;">Preenche o valor total pra ver as condições.</div>'+
        '</div>'+
        '<div class="card form-card">'+
          '<h3 style="margin-top:0;">Calculadora</h3>'+
          '<div class="calc-display" id="calcDisplay">0</div>'+
          '<div class="calc-pad">'+
            ['C','⌫','%','÷', '7','8','9','×', '4','5','6','-', '1','2','3','+', '0','.','=',''].map(function(k){
              if (k==="") return '<span></span>';
              var cls = (k==='=' ? 'calc-eq' : (['÷','×','-','+','%'].indexOf(k)>=0 ? 'calc-op' : ''));
              return '<button class="'+cls+'" data-key="'+esc(k)+'">'+esc(k)+'</button>';
            }).join("")+
          '</div>'+
        '</div>'+
      '</div>';
  }

  function bindCalculadoraEvents(){
    function atualizaSimulador(){
      var valor = parseFloat(document.getElementById("simValor").value)||0;
      var desc = parseFloat(document.getElementById("simDesc").value)||0;
      var parc = Math.max(1, parseInt(document.getElementById("simParc").value)||1);
      var entradaPct = parseFloat(document.getElementById("simEntrada").value)||0;
      var box = document.getElementById("simResultado");
      if (valor<=0) { box.className = "empty-state"; box.style.textAlign="left"; box.textContent = "Preenche o valor total pra ver as condições."; return; }
      var valorAVista = valor * (1 - desc/100);
      var economia = valor - valorAVista;
      var entrada = valor * (entradaPct/100);
      var saldo = valor - entrada;
      var parcela = valor / parc;
      box.className = "";
      box.innerHTML =
        '<div class="side-stat"><span>À vista ('+desc+'% off)</span><span class="v num" style="color:var(--st-fechado);">'+fmtBRL(valorAVista)+'</span></div>'+
        '<div class="side-stat"><span>Economia à vista</span><span class="v num">'+fmtBRL(economia)+'</span></div>'+
        '<div class="side-stat"><span>Entrada ('+entradaPct+'%)</span><span class="v num">'+fmtBRL(entrada)+'</span></div>'+
        '<div class="side-stat"><span>Saldo na entrega</span><span class="v num">'+fmtBRL(saldo)+'</span></div>'+
        '<div class="side-stat"><span>'+parc+'x sem juros</span><span class="v num">'+fmtBRL(parcela)+'</span></div>';
    }
    ["simValor","simDesc","simParc","simEntrada"].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.addEventListener("input", atualizaSimulador);
    });
    atualizaSimulador();

    var display = document.getElementById("calcDisplay");
    Array.prototype.forEach.call(document.querySelectorAll(".calc-pad button"), function(btn){
      btn.addEventListener("click", function(){
        var k = btn.getAttribute("data-key");
        if (k==="C") { calcExpr=""; }
        else if (k==="⌫") { calcExpr = calcExpr.slice(0,-1); }
        else if (k==="=") {
          var r = calcSafeEval(calcExpr);
          calcExpr = r==null ? "Erro" : String(Math.round(r*100)/100);
        } else {
          if (calcExpr==="Erro") calcExpr="";
          calcExpr += k;
        }
        display.textContent = calcExpr || "0";
      });
    });
  }

  // ---------- Relatório bruto (pra colar em outra IA) ----------
  var relInicio = null, relFim = null;
  function relDefaultRange(){
    if (!relFim) relFim = todayISO();
    if (!relInicio) { var d = new Date(); d.setDate(d.getDate()-6); relInicio = d.toISOString().slice(0,10); }
  }
  function inPeriodo(dateStr, inicio, fim){
    if (!dateStr) return false;
    var s = String(dateStr).slice(0,10);
    return s>=inicio && s<=fim;
  }

  function computeRelatorioData(inicio, fim){
    var campanhas = Array.from(state.campaigns.values()).filter(function(c){
      return c.periodoInicio && c.periodoFim && c.periodoInicio<=fim && c.periodoFim>=inicio;
    });
    var gastoTotal = campanhas.reduce(function(s,c){ return s+(Number(c.gastoTotal)||0); }, 0);
    var leadsGeradosTrafego = campanhas.reduce(function(s,c){ return s+(Number(c.resultado)||0); }, 0);
    var cpaSemana = leadsGeradosTrafego>0 ? gastoTotal/leadsGeradosTrafego : null;
    var criativosAtivos = Array.from(state.criativos.values()).filter(function(c){ return c.status==="ativo"; });

    var leads = Array.from(state.leads.values());
    var leadsRecebidos = leads.filter(function(l){ return inPeriodo(l.criadoEm, inicio, fim); }).length;
    var frios = leads.filter(function(l){ return l.estagio==="frio"; }).length;
    var mornos = leads.filter(function(l){ return l.estagio==="morno"; }).length;
    var quentes = leads.filter(function(l){ return l.estagio==="quente"; }).length;
    var fechadosPeriodo = leads.filter(function(l){ return l.estagio==="fechado" && inPeriodo(l.atualizadoEm, inicio, fim); });
    var vendasFechadas = fechadosPeriodo.length;
    var faturamento = fechadosPeriodo.reduce(function(s,l){ return s+(Number(l.valor)||0); }, 0);
    var produtosContagem = {};
    fechadosPeriodo.forEach(function(l){
      var nome = (l.produto||"").trim() || "(sem produto informado)";
      produtosContagem[nome] = (produtosContagem[nome]||0)+1;
    });
    var produtosVendidos = Object.keys(produtosContagem).map(function(nome){ return {nome:nome, qtd:produtosContagem[nome]}; });

    var custoAtual = computeCustoBloco();
    var cacRealPeriodo = vendasFechadas>0 ? gastoTotal/vendasFechadas : null;
    var trafegoScore = computePontuacaoTrafego(custoAtual).pontuacao;
    var comercialScore = computePontuacaoComercial().pontuacao;

    return {
      gastoTotal:gastoTotal, leadsGeradosTrafego:leadsGeradosTrafego, cpaSemana:cpaSemana, criativosAtivos:criativosAtivos,
      leadsRecebidos:leadsRecebidos, frios:frios, mornos:mornos, quentes:quentes,
      vendasFechadas:vendasFechadas, faturamento:faturamento, produtosVendidos:produtosVendidos,
      cacRealPeriodo:cacRealPeriodo, cacAlvo:custoAtual.cacAlvo, trafegoScore:trafegoScore, comercialScore:comercialScore
    };
  }

  function formatRelatorioTexto(d, inicio, fim){
    var linhas = [];
    linhas.push("RELATÓRIO SEMANAL — STYLO FIBRA");
    linhas.push("Período: "+fmtDate(inicio)+" a "+fmtDate(fim));
    linhas.push("");
    linhas.push("TRÁFEGO PAGO");
    linhas.push("Gasto total: "+fmtBRL(d.gastoTotal));
    linhas.push("Leads gerados: "+d.leadsGeradosTrafego);
    linhas.push("CPA: "+(d.cpaSemana!=null ? fmtBRL(d.cpaSemana) : "—"));
    linhas.push("Criativos ativos:");
    if (d.criativosAtivos.length) {
      d.criativosAtivos.forEach(function(c){
        var partes = [];
        if (c.cpa) partes.push("CPA "+fmtBRL(c.cpa));
        if (c.taxaConversao) partes.push(c.taxaConversao+"% conversão");
        linhas.push("- "+(c.titulo||"Sem título")+(partes.length?" — "+partes.join(", "):""));
      });
    } else {
      linhas.push("- nenhum criativo marcado como ativo no momento");
    }
    linhas.push("");
    linhas.push("COMERCIAL");
    linhas.push("Leads recebidos: "+d.leadsRecebidos);
    linhas.push("Status atual: "+d.frios+" frios / "+d.mornos+" mornos / "+d.quentes+" quentes");
    linhas.push("Vendas fechadas: "+d.vendasFechadas);
    linhas.push("Faturamento: "+fmtBRL(d.faturamento));
    linhas.push("Produtos vendidos:");
    if (d.produtosVendidos.length) {
      d.produtosVendidos.forEach(function(p){ linhas.push("- "+p.nome+(p.qtd>1?" (x"+p.qtd+")":"")); });
    } else {
      linhas.push("- nenhuma venda fechada no período");
    }
    linhas.push("");
    linhas.push("INDICADORES");
    linhas.push("CAC real do período: "+(d.cacRealPeriodo!=null ? fmtBRL(d.cacRealPeriodo) : "—"));
    linhas.push("CAC-alvo: "+(d.cacAlvo ? fmtBRL(d.cacAlvo) : "—"));
    linhas.push("Pontuação Tráfego: "+(d.trafegoScore!=null ? d.trafegoScore+"/100" : "—"));
    linhas.push("Pontuação Comercial: "+(d.comercialScore!=null ? d.comercialScore+"/100" : "—"));
    return linhas.join("\n");
  }

    function aplicarPeriodo(inicio, fim){ relInicio = inicio; relFim = fim; render(); }
    var b7 = document.getElementById("relUlt7");
    if (b7) b7.addEventListener("click", function(){
      var f = todayISO(); var d = new Date(); d.setDate(d.getDate()-6);
      aplicarPeriodo(d.toISOString().slice(0,10), f);
    });
    var bMes = document.getElementById("relEsteMes");
    if (bMes) bMes.addEventListener("click", function(){
      var now = new Date();
      var inicio = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
      aplicarPeriodo(inicio, todayISO());
    });
    var bMesPassado = document.getElementById("relMesPassado");
    if (bMesPassado) bMesPassado.addEventListener("click", function(){
      var now = new Date();
      var inicio = new Date(now.getFullYear(), now.getMonth()-1, 1);
      var fim = new Date(now.getFullYear(), now.getMonth(), 0);
      aplicarPeriodo(inicio.toISOString().slice(0,10), fim.toISOString().slice(0,10));
    });
    var bGerar = document.getElementById("btnGerarRelatorio");
    if (bGerar) bGerar.addEventListener("click", function(){

      var f = document.getElementById("relFimInput").value;

      aplicarPeriodo(i, f);
    });
    var bCopiar = document.getElementById("btnCopiarRelatorio");
    if (bCopiar) bCopiar.addEventListener("click", function(){
      var txt = document.getElementById("relatorioTexto").textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) {

      }
    });
  }

  function generateOrcamentoText(o){
    var linhas = o.itens.map(function(it){
      return "• "+it.desc+(it.valor? "  —  "+fmtBRL(it.valor) : "");
    }).join("\n");
    var txt = "Olá, "+ (o.clienteNome||"tudo bem") +"! Segue o orçamento combinado:\n\n"+
      linhas+"\n\n"+
      "Subtotal: "+fmtBRL(o.subtotal)+"\n";
    if (o.descontoPct) {
      txt += "💰 À vista ("+o.descontoPct+"% de desconto): "+fmtBRL(o.totalAvista)+"\n";
    }
    if (o.pagamento) txt += "📦 Pagamento: "+o.pagamento+"\n";
    if (o.entrega) txt += "🚚 Entrega: "+o.entrega+"\n";
    if (o.acabamento) txt += "🎨 Acabamento: "+o.acabamento+"\n";
    if (o.obs) txt += "\n"+o.obs+"\n";
    txt += "\nFico à disposição pra qualquer ajuste!";
    return txt;
  }

  function slugify(s){
    return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "cliente";
  }

  function fetchAsDataUrl(url){
    return fetch(url).then(function(r){
      if (!r.ok) throw new Error("fetch da imagem falhou");
      return r.blob();
    }).then(function(blob){
      return new Promise(function(resolve, reject){
        var reader = new FileReader();
        reader.onload = function(){ resolve(reader.result); };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    });
  }

  function imgFormatFromDataUrl(durl){
    var m = /^data:image\/(png|jpe?g|webp)/i.exec(durl || "");
    if (!m) return "PNG";
    var t = m[1].toLowerCase();
    if (t === "jpg" || t === "jpeg") return "JPEG";
    if (t === "webp") return "WEBP";
    return "PNG";
  }

  function generateQrDataUrl(text){
    try {
      var el = document.getElementById("qrHidden");
      if (!el || typeof QRCode === "undefined") return null;
      el.innerHTML = "";
      new QRCode(el, {text:text, width:180, height:180, colorDark:"#0E6E68", colorLight:"#ffffff"});
      var canvas = el.querySelector("canvas");
      if (canvas) return canvas.toDataURL("image/png");
      var img = el.querySelector("img");
      return img ? img.src : null;
    } catch(e){ console.error("QR falhou", e); return null; }
  }

  // Paleta oficial dos documentos Stylo Fibra (igual ao recibo padrão)
  var PDF_BROWN = [74,50,35];      // marca / caixas de destaque
  var PDF_TAN   = [176,137,104];   // detalhe / bullets / linha de destaque
  var PDF_CREAM = [237,230,220];   // caixa do cliente
  var PDF_GREY  = [51,51,51];      // texto de corpo
  var PDF_WHITE = [255,255,255];

  function buildOrcamentoPdf(o){
    if (!window.jspdf || !window.jspdf.jsPDF) return Promise.reject(new Error("jsPDF indisponível"));
    var jsPDFCtor = window.jspdf.jsPDF;
    var doc = new jsPDFCtor({unit:"pt", format:"a4"});
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var margin = 50;

    // ---- cabeçalho de marca ----
    var headH = 92;
    doc.setFillColor.apply(doc, PDF_BROWN);
    doc.rect(0,0,pageW,headH,"F");
    doc.setTextColor.apply(doc, PDF_WHITE);
    doc.setFont("helvetica","bold");
    doc.setFontSize(24);
    doc.text("STYLO FIBRA", margin, 40);
    doc.setFont("helvetica","normal");
    doc.setFontSize(10.5);
    doc.text("Móveis em fibra sintética e corda náutica", margin, 58);
    doc.setFontSize(9);
    doc.text("Loja física: Abaetetuba - PA", margin, 74);

    doc.setFont("helvetica","bold");
    doc.setFontSize(14);
    doc.text("ORÇAMENTO", pageW-margin, 40, {align:"right"});
    doc.setFont("helvetica","normal");
    doc.setFontSize(9.5);
    var dataStr = new Date(o.criadoEm||Date.now()).toLocaleDateString("pt-BR");
    doc.text("Data: "+dataStr, pageW-margin, 56, {align:"right"});

    var y = headH + 42;

    // ---- caixa do cliente ----
    doc.setFillColor.apply(doc, PDF_CREAM);
    doc.roundedRect(margin, y-24, pageW-margin*2, 40, 6, 6, "F");
    doc.setFont("helvetica","bold");
    doc.setFontSize(11);
    doc.setTextColor.apply(doc, PDF_BROWN);
    doc.text("Cliente:", margin+16, y);
    doc.setFont("helvetica","normal");
    doc.setTextColor.apply(doc, PDF_GREY);
    doc.text(String(o.clienteNome||"—"), margin+70, y);
    y += 46;

    // ---- foto do kit (se houver), reservando espaço à direita ----
    var photoW = 110, photoH = 110;
    var hasPhoto = !!o._fotoDataUrl;
    var photoTopY = y;
    if (hasPhoto) {
      try {
        doc.addImage(o._fotoDataUrl, imgFormatFromDataUrl(o._fotoDataUrl), pageW-margin-photoW, photoTopY, photoW, photoH, undefined, "FAST");
      } catch(e){ console.error("addImage foto falhou", e); hasPhoto = false; }
    }
    var textW = hasPhoto ? (pageW - margin*2 - photoW - 18) : (pageW - margin*2);

    // ---- parágrafo introdutório ----
    doc.setFont("helvetica","normal");
    doc.setFontSize(10.5);
    doc.setTextColor.apply(doc, PDF_GREY);
    var intro = "Preparamos o orçamento abaixo para "+(o.clienteNome||"você")+", com os itens e condições descritos a seguir.";
    var introSplit = doc.splitTextToSize(intro, textW);
    doc.text(introSplit, margin, y);
    y += introSplit.length*14 + 18;

    // ---- descrição do produto ----
    doc.setFont("helvetica","bold");
    doc.setFontSize(12);
    doc.setTextColor.apply(doc, PDF_BROWN);
    doc.text("Descrição do produto", margin, y);
    y += 6;
    doc.setDrawColor.apply(doc, PDF_TAN);
    doc.setLineWidth(1);
    doc.line(margin, y, margin+textW, y);
    y += 20;

    doc.setFont("helvetica","normal");
    doc.setFontSize(10.5);
    var bulletLines = (o.itens||[]).map(function(it){
      return String(it.desc||"") + (it.valor ? "  —  "+fmtBRL(it.valor) : "");
    });
    if (o.acabamento) bulletLines.push("Acabamento: "+o.acabamento);
    bulletLines.forEach(function(line){
      doc.setFillColor.apply(doc, PDF_TAN);
      doc.circle(margin+3, y-3.5, 2.2, "F");
      doc.setTextColor.apply(doc, PDF_GREY);
      var split = doc.splitTextToSize(line, textW-16);
      doc.text(split, margin+14, y);
      y += split.length*14 + 6;
    });

    if (hasPhoto) y = Math.max(y, photoTopY + photoH + 10);
    y += 6;

    if (o.descontoPct) {
      doc.setFont("helvetica","italic");
      doc.setFontSize(9.5);
      doc.setTextColor.apply(doc, PDF_GREY);
      doc.text("Valor de tabela: "+fmtBRL(o.subtotal)+"   ->   "+o.descontoPct+"% de desconto para pagamento à vista", margin, y);
      y += 26;
    } else {
      y += 12;
    }

    // ---- caixa de valores (marrom, igual ao recibo) ----
    var hasPagamento = !!o.pagamento;
    var boxH = 34 + (hasPagamento ? 30 : 0);
    doc.setFillColor.apply(doc, PDF_BROWN);
    doc.roundedRect(margin, y, pageW-margin*2, boxH, 8, 8, "F");
    var rowY = y + 26;
    doc.setFont("helvetica","normal");
    doc.setFontSize(11);
    doc.setTextColor.apply(doc, PDF_WHITE);
    var totalLabel = o.descontoPct ? "Valor total do pedido (à vista, "+o.descontoPct+"% de desconto)" : "Valor total do pedido";
    doc.text(totalLabel, margin+16, rowY);
    doc.setFont("helvetica","bold");
    doc.setFontSize(16);
    doc.text(fmtBRL(o.descontoPct ? o.totalAvista : o.subtotal), pageW-margin-16, rowY, {align:"right"});
    if (hasPagamento) {
      rowY += 28;
      doc.setFont("helvetica","normal");
      doc.setFontSize(10.5);
      doc.setTextColor.apply(doc, PDF_TAN);
      doc.text("Condição parcelada", margin+16, rowY);
      doc.setFont("helvetica","bold");
      doc.text(String(o.pagamento), pageW-margin-16, rowY, {align:"right"});
    }
    y += boxH + 34;

    // ---- dados para pagamento — pix ----
    var qrSize = 78;
    var hasQr = !!o._qrDataUrl;
    var pixTextW = hasQr ? (pageW-margin*2-qrSize-16) : (pageW-margin*2);
    doc.setFont("helvetica","bold");
    doc.setFontSize(12);
    doc.setTextColor.apply(doc, PDF_BROWN);
    doc.text("Dados para pagamento — Pix", margin, y);
    y += 6;
    doc.setDrawColor.apply(doc, PDF_TAN);
    doc.line(margin, y, margin+pixTextW, y);
    y += 20;

    var pixStartY = y;
    doc.setFontSize(10);
    [["Chave Pix (CPF):","043.993.572-58"],["Favorecido:","Iago — Stylo Fibra"],["CPF do favorecido:","043.993.572-58"]].forEach(function(row){
      doc.setFont("helvetica","bold");
      doc.setTextColor.apply(doc, PDF_BROWN);
      doc.text(row[0], margin, y);
      doc.setFont("helvetica","normal");
      doc.setTextColor.apply(doc, PDF_GREY);
      doc.text(row[1], margin+128, y);
      y += 17;
    });

    if (hasQr) {
      doc.addImage(o._qrDataUrl, "PNG", pageW-margin-qrSize, pixStartY-14, qrSize, qrSize);
      doc.setFont("helvetica","normal");
      doc.setFontSize(8);
      doc.setTextColor.apply(doc, PDF_GREY);
      doc.text("Chama no WhatsApp", pageW-margin-qrSize/2, pixStartY-14+qrSize+11, {align:"center"});
    }
    y += 22;

    // ---- observações ----
    doc.setFont("helvetica","bold");
    doc.setFontSize(12);
    doc.setTextColor.apply(doc, PDF_BROWN);
    doc.text("Observações", margin, y);
    y += 6;
    doc.setDrawColor.apply(doc, PDF_TAN);
    doc.line(margin, y, pageW-margin, y);
    y += 20;

    var obsLines = ["Este orçamento tem validade de 7 dias.", "Após a aprovação, a produção começa com entrada de 50%.", "Prazo de produção a combinar após a confirmação do pedido."];
    if (o.entrega) obsLines.splice(2, 0, "Entrega: "+o.entrega);
    if (o.obs) obsLines.push(o.obs);
    doc.setFont("helvetica","normal");
    doc.setFontSize(9.5);
    obsLines.forEach(function(l){
      doc.setTextColor.apply(doc, PDF_TAN);
      doc.text("•", margin, y);
      doc.setTextColor.apply(doc, PDF_GREY);
      var split = doc.splitTextToSize(l, pageW-margin*2-14);
      doc.text(split, margin+12, y);
      y += split.length*13 + 5;
    });

    // ---- rodapé ----
    var footY = pageH - 40;
    doc.setDrawColor.apply(doc, PDF_TAN);
    doc.setLineWidth(0.75);
    doc.line(margin, footY-16, pageW-margin, footY-16);
    doc.setFont("helvetica","normal");
    doc.setFontSize(9);
    doc.setTextColor.apply(doc, PDF_GREY);
    doc.text("Stylo Fibra", margin, footY);
    doc.setFont("helvetica","bold");
    doc.text("Stylo Fibra", pageW/2, footY-8, {align:"center"});
    doc.setFont("helvetica","normal");
    doc.setFontSize(8.5);
    doc.text("@stylosfibra  ·  Abaetetuba - PA  ·  Fale com a gente pelo WhatsApp", pageW/2, footY+6, {align:"center"});

    return Promise.resolve(doc.output("blob"));
  }

  function handleGerarPdf(o){
    showToast("Gerando PDF...");
    var payload = Object.assign({}, o);
    var prep = Promise.resolve();
    var _fotoSrcForPdf = o.fotoUrl ? o.fotoUrl : (o.fotoId ? "/_blob/"+o.fotoId : null);
    if (_fotoSrcForPdf) {
      prep = prep.then(function(){ return fetchAsDataUrl(_fotoSrcForPdf); })
        .then(function(durl){ payload._fotoDataUrl = durl; })
        .catch(function(err){ console.error("foto não carregou pro PDF", err); });
    }
    prep = prep.then(function(){
      var waText = encodeURIComponent("Oi! Recebi o orçamento"+(o.clienteNome?" da "+o.clienteNome:"")+" e quero fechar!");
      payload._qrDataUrl = generateQrDataUrl("https://wa.me/5591999880521?text="+waText);
    });
    prep.then(function(){ return buildOrcamentoPdf(payload); })
      .then(function(blob){
        if (!downloadsCap) { showToast("Download indisponível nessa visualização."); return null; }
        var fname = "orcamento-"+slugify(o.clienteNome)+".pdf";
        return downloadsCap.save({filename: fname, data: blob});
      })
      .then(function(res){ if (res) showToast("PDF pronto!"); })
      .catch(function(err){
        console.error(err);
        if (err && err.code === "declined") return;
        showToast("Não deu pra gerar o PDF agora.");
      });
  }

        if (!file || !assets) return;
        document.getElementById("imgUploadStatus").textContent = "Enviando...";
        assets.upload(file).then(function(res){
          contentDraftImg = {id: res.id, url: res.url};
          document.getElementById("imgPreview").outerHTML =
            '<img id="imgPreview" src="'+res.url+'" style="width:64px;height:64px;object-fit:cover;border-radius:9px;border:1px solid var(--border);">';
          document.getElementById("imgUploadStatus").textContent = "Imagem anexada";
        }).catch(function(err){
          console.error(err);
          document.getElementById("imgUploadStatus").textContent = "Não deu pra enviar a imagem — tenta outra.";
          showToast("Erro ao enviar imagem"+(err&&err.message?": "+err.message:"")+".");
        });
      });
    }
    document.getElementById("btnSaveContent").addEventListener("click", function(){
      var data = {
        data: document.getElementById("ctData").value || todayISO(),
        tipo: document.getElementById("ctTipo").value,
        status: document.getElementById("ctStatus").value,
        nota: document.getElementById("ctNota").value.trim()
      };
      if (contentDraftImg) {
        if (contentDraftImg.id) data.imagemId = contentDraftImg.id;
        if (/^https?:/.test(contentDraftImg.url||"")) data.imagemUrl = contentDraftImg.url;
      }
      if (it && it.id) {
        docUpdate("content", it.id, data).then(function(){ showToast("Post atualizado."); closeModal(); });
      } else {
        docAdd("content", data).then(function(){ showToast("Post adicionado."); closeModal(); });
      }
    });
  }

  // ---------------- event binding per view ----------------
  function bindViewEvents(){
    if (currentTab === "painel") {
      bindPainelEvents();
    } else if (currentTab === "pipeline") {
      var nb = document.getElementById("btnNovoLead");
      if (nb) nb.addEventListener("click", function(){ openLeadForm(null); });
      Array.prototype.forEach.call(document.querySelectorAll('[data-action="edit-lead"]'), function(card){
        card.addEventListener("click", function(){ openLeadForm(state.leads.get(card.dataset.id)); });
      });
    } else if (currentTab === "reengajar") {
      var btnImp = document.getElementById("btnImportarFrios");
      if (btnImp) btnImp.addEventListener("click", openBulkImportForm);
      var btnSalvarModelo = document.getElementById("btnSalvarModelo");
      if (btnSalvarModelo) btnSalvarModelo.addEventListener("click", function(){
        var cfgAtual = state.settings.get("geral") || {};
        var data = Object.assign({}, cfgAtual, {
          mensagemPromo: document.getElementById("msgPromoInput").value,
          mensagemPergunta: document.getElementById("msgPerguntaInput").value,
          mensagemProva: document.getElementById("msgProvaInput").value
        });
        docSet("settings", "geral", data).then(function(){ showToast("Modelos salvos."); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-action="edit-lead"]'), function(el){
        el.addEventListener("click", function(){ openLeadForm(state.leads.get(el.dataset.id)); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("#marcarContatado"), function(btn){
        btn.addEventListener("click", function(e){
          e.stopPropagation();
          docUpdate("leads", btn.dataset.id, {atualizadoEm: new Date().toISOString()}).then(function(){ showToast("Marcado como contatado hoje."); });
        });
      });
    } else if (currentTab === "orcamentos") {
      bindOrcamentoEvents();
    } else if (currentTab === "logistica") {
      var btnNovaEntrega = document.getElementById("btnNovaEntrega");
      if (btnNovaEntrega) btnNovaEntrega.addEventListener("click", function(){ openLogisticaForm(null); });
      Array.prototype.forEach.call(document.querySelectorAll('[data-action="edit-log"]'), function(card){
        card.addEventListener("click", function(){ openLogisticaForm(state.logistica.get(card.dataset.id)); });
      });
    } else if (currentTab === "campanhas") {
      var ncb = document.getElementById("btnNovaCamp");
      if (ncb) ncb.addEventListener("click", function(){ openCampForm(null); });
      Array.prototype.forEach.call(document.querySelectorAll("#editCamp"), function(btn){
        btn.addEventListener("click", function(){ openCampForm(state.campaigns.get(btn.dataset.id)); });
      });
    } else if (currentTab === "conteudo") {
      var nco = document.getElementById("btnNovoConteudo");
      if (nco) nco.addEventListener("click", function(){ openContentForm(null); });
      Array.prototype.forEach.call(document.querySelectorAll("#editContent"), function(btn){
        btn.addEventListener("click", function(){ openContentForm(state.content.get(btn.dataset.id)); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("#toggleContent"), function(btn){
        btn.addEventListener("click", function(){
          var it = state.content.get(btn.dataset.id);
          if (!it) return;
          docUpdate("content", it.id, {status: it.status==="postado" ? "planejado" : "postado"});
        });
      });
    } else if (currentTab === "clientes") {
      Array.prototype.forEach.call(document.querySelectorAll('[data-action="edit-lead"]'), function(card){
        card.addEventListener("click", function(){ openLeadForm(state.leads.get(card.dataset.id)); });
      });
    } else if (currentTab === "criativos") {
      bindCriativosEvents();
    } else if (currentTab === "produtos") {
      bindProdutosEvents();
    } else if (currentTab === "materiais") {
      bindMateriaisEvents();
    } else if (currentTab === "calendario") {
      var calPrev = document.getElementById("calPrev");
      var calNext = document.getElementById("calNext");
      var calHoje = document.getElementById("calHoje");
      if (calPrev) calPrev.addEventListener("click", function(){ calMonthOffset--; render(); });
      if (calNext) calNext.addEventListener("click", function(){ calMonthOffset++; render(); });
      if (calHoje) calHoje.addEventListener("click", function(){ calMonthOffset=0; render(); });
    } else if (currentTab === "calculadora") {
      bindCalculadoraEvents();
    } else if (currentTab === "relatorio") {
      bindRelatorioEvents();
    }
  }

  // ---------------- boot ----------------
  bindMobileMenu();
  wireLoginForm();
  wireLogoutButton();
  initDb();
  render();
})();
</script>
